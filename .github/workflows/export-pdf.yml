name: Convert Flowcharts to PDF

on:
  push:
    paths:
      - 'Practice-*-Flowchart.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI (Skip Chromium Download)
        run: |
          PUPPETEER_SKIP_DOWNLOAD=true npm install -g @mermaid-js/mermaid-cli

      - name: Create Puppeteer Config for Pre-Installed Chrome
        run: |
          cat << 'EOF' > /tmp/puppeteer-config.json
          {
            "executablePath": "/usr/bin/google-chrome",
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
          }
          EOF

      - name: Render Mermaid Diagrams to PDF
        run: |
          mkdir -p pdf-exports /tmp/mmd
          for file in Practice-*-Flowchart.md; do
            if [ -f "$file" ]; then
              base="${file%.md}"
              echo "Extracting Mermaid code from $file..."
              awk '/^```mermaid/{flag=1; next} /^```/{flag=0} flag' "$file" > "/tmp/mmd/${base}.mmd"
              if [ -s "/tmp/mmd/${base}.mmd" ]; then
                echo "Rendering pdf-exports/${base}.pdf..."
                timeout 45s mmdc -i "/tmp/mmd/${base}.mmd" -o "pdf-exports/${base}.pdf" -p /tmp/puppeteer-config.json --pdfFit
              fi
            fi
          done

      - name: Commit generated PDFs back to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pdf-exports/*.pdf
          git diff --staged --quiet || git commit -m "Auto-generate PDF flowcharts"
          git push
