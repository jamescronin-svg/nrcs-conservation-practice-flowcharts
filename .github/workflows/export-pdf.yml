name: Convert Flowcharts to PDF

on:
  push:
    paths:
      - 'Practice-*-Flowchart.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI & Chromium dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
          npm install -g @mermaid-js/mermaid-cli

      - name: Render Mermaid Diagrams to PDF
        run: |
          mkdir -p pdf-exports
          for file in Practice-*-Flowchart.md; do
            if [ -f "$file" ]; then
              base="${file%.md}"
              echo "Converting $file to pdf-exports/${base}.pdf..."
              mmdc -i "$file" -o "pdf-exports/${base}.pdf" --pdfFit
            fi
          done

      - name: Commit generated PDFs back to repo
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add pdf-exports/*.pdf
          git diff --staged --quiet || git commit -m "Auto-generate PDF flowcharts"
          git push
